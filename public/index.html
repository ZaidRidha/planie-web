<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff4041" />
    <!-- Defaults for every React route (waitlist, contact, privacy, guides...).
         Routes that need their own tags override these client-side via
         src/utils/seo.js; the homepage is a separate static file
         (public/marketing/home.html) and carries its own set. -->
    <meta
      name="description"
      content="Tell Planie the kind of time you want, and get a real plan back - places, timings and travel that fit together. Date nights, days out and group trips, sorted."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Planie" />
    <meta property="og:title" content="Planie - Your Saturday, solved" />
    <meta property="og:description" content="Tell Planie the kind of time you want, and get a real plan back - places, timings and travel that fit together. Date nights, days out and group trips, sorted." />
    <meta property="og:image" content="https://useplanie.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Planie logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://useplanie.com/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
/>

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Planie - Your Saturday, solved</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      /* Apply saved theme before paint to avoid a light-mode flash. */
      try { if (localStorage.getItem("plie-theme") === "dark") document.documentElement.classList.add("plie-dark"); } catch (e) {}
    </script>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
